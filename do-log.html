<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Production">
<title>บันทึกเลขตั๋ว D/O</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #5d6675; --line: #dde1e7;
    --accent: #1f5fbf; --ok: #1d7a3e; --bad: #b42318; --bad-bg: #fde4e1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #14171c; --card: #1d2128; --text: #e6e9ee; --muted: #9aa3b0; --line: #2e343d;
      --accent: #6fa3ff; --ok: #5cc98a; --bad: #ff8a80; --bad-bg: #3a1d1b; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #14171c; --card: #1d2128; --text: #e6e9ee; --muted: #9aa3b0; --line: #2e343d;
    --accent: #6fa3ff; --ok: #5cc98a; --bad: #ff8a80; --bad-bg: #3a1d1b; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Sarabun", "Noto Sans Thai", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding-block: 16px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 1.4rem; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 14px; font-size: .9rem; }
  .back { display: inline-block; color: var(--accent); text-decoration: none; font-size: .9rem; margin-bottom: 10px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  #doIn { font: inherit; font-size: 1.6rem; letter-spacing: .06em; font-variant-numeric: tabular-nums; width: 100%; padding: 10px 12px;
    border: 2px solid var(--accent); border-radius: 10px; background: var(--bg); color: var(--text); }
  .count { font-size: .85rem; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  #msg { margin-top: 10px; min-height: 2.4em; font-size: 1.05rem; font-weight: 600; }
  #msg.ok { color: var(--ok); } #msg.bad { color: var(--bad); }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: .95rem; }
  .stats b { font-size: 1.3rem; color: var(--accent); font-variant-numeric: tabular-nums; }
  .stats .bad b { color: var(--bad); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .btn { font: inherit; border-radius: 8px; padding: 8px 14px; border: 1px solid var(--line); background: var(--card); color: var(--accent); cursor: pointer; }
  .btn.d { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  th { font-size: .8rem; color: var(--muted); font-weight: 600; }
  td.no { width: 3.2em; font-weight: 700; }
  td.do { font-size: 1.05rem; letter-spacing: .03em; }
  td small { display: block; color: var(--muted); font-size: .78rem; letter-spacing: 0; }
  tr.dup td { color: var(--bad); background: var(--bad-bg); font-weight: 700; }
  tr.dup td small { color: var(--bad); }
  .scroll { overflow-x: auto; }
  .empty { color: var(--muted); }
  .note { font-size: .8rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">← หน้าหลัก</a>
  <h1>บันทึกเลขตั๋ว D/O</h1>
  <p class="sub">พิมพ์หรือยิงบาร์โค้ดเลขตั๋ว — ครบ 13 หลักบันทึกทันที เรียงลำดับ 1, 2, 3 … · เลขซ้ำบันทึกด้วยแต่ขึ้นสีแดง</p>

  <section>
    <label for="doIn">เลขตั๋ว D/O (13 หลัก)</label>
    <input id="doIn" type="text" class="npad" data-pad="int" inputmode="numeric" autocomplete="off" maxlength="13" placeholder="พิมพ์หรือยิง 13 หลัก">
    <div class="count" id="count">0/13</div>
    <div id="msg" role="status" aria-live="polite"></div>
  </section>

  <section>
    <div class="stats"><span>ทั้งหมด <b id="total">0</b> ใบ</span><span class="bad">ซ้ำ <b id="dups">0</b> ใบ</span></div>
    <div class="row">
      <button class="btn" id="copy" type="button">📋 คัดลอกทั้งหมด (วางใน Excel)</button>
      <button class="btn d" id="reset" type="button">เริ่มรายการใหม่</button>
      <span class="note" id="tools"></span>
    </div>
  </section>

  <section>
    <div class="scroll"><table><thead><tr><th>ลำดับ</th><th>D/O</th><th>เวลาบันทึก</th></tr></thead><tbody id="list"></tbody></table></div>
    <p class="note" style="margin:8px 0 0">ล่าสุดอยู่บนสุด · เก็บในเครื่องนี้ ปิดหน้าแล้วกลับมาต่อได้</p>
  </section>
</main>

<script src="fieldreport.js"></script>
<script src="dolog.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const KEY = "dolog-v1";
  // starting a new list needs the code (same as deleting a field report)
  const RESET_HASH = "c6f9017f4820b334c5b7a4b271f1c0429e3147839f3c56422045cd4fd407476a";
  let list = [];
  try { list = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { list = []; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) { $("tools").textContent = "⚠️ บันทึกในเครื่องไม่ได้ — คัดลอกเก็บไว้ก่อนปิดหน้า"; } };
  const pad = (n) => String(n).padStart(2, "0");
  const time = (ms) => { const d = new Date(ms); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // what a ticket says: plant (first 3 digits) and ticket date (digits 4–9, YYMMDD)
  const info = (d) => {
    const p = FieldReport.plantFromDO(d).name || "ไม่พบหน่วยผลิต " + d.slice(0, 3);
    const yy = d.slice(3, 5), mm = d.slice(5, 7), dd = d.slice(7, 9);
    return `${p} · ตั๋ววันที่ ${dd}/${mm}/${Number(yy) + 2543}`;
  };

  function render() {
    const dup = DoLog.duplicates(list);
    $("total").textContent = list.length;
    $("dups").textContent = dup.size;
    $("list").innerHTML = list.length ? list.slice().reverse().map((e) => `<tr class="${dup.has(e.no) ? "dup" : ""}">
        <td class="no">${e.no}</td>
        <td class="do">${esc(e.do)}<small>${esc(info(e.do))}${e.dupOf ? ` · ⚠️ ซ้ำกับลำดับ ${e.dupOf}` : dup.has(e.no) ? ` · ⚠️ ซ้ำที่ลำดับ ${list.filter((x) => x.dupOf === e.no).map((x) => x.no).join(", ")}` : ""}</small></td>
        <td>${time(e.at)}</td></tr>`).join("")
      : `<tr><td colspan="3" class="empty">ยังไม่มีรายการ — พิมพ์หรือยิงเลขตั๋วด้านบน</td></tr>`;
  }

  // saved as soon as 13 digits are in; the box empties for the next ticket
  $("doIn").addEventListener("input", () => {
    const el = $("doIn"), d = DoLog.digits(el.value);
    if (d !== el.value) el.value = d;
    $("count").textContent = `${d.length}/13`;
    if (!DoLog.complete(d)) return;
    const e = DoLog.add(list, d, Date.now());
    save();
    el.value = ""; $("count").textContent = "0/13";
    $("msg").className = e.dupOf ? "bad" : "ok";
    $("msg").textContent = e.dupOf ? `⚠️ ลำดับ ${e.no}: ${d} ซ้ำกับลำดับ ${e.dupOf} — บันทึกไว้แล้ว` : `✓ บันทึกลำดับ ${e.no}: ${d}`;
    if (navigator.vibrate) navigator.vibrate(e.dupOf ? [80, 60, 80] : 40);
    render();
  });

  $("copy").addEventListener("click", async () => {
    if (!list.length) return;
    const text = DoLog.toText(list, (ms) => time(ms));
    try { await navigator.clipboard.writeText(text); $("tools").textContent = `คัดลอก ${list.length} รายการแล้ว`; }
    catch (e) { $("tools").textContent = "คัดลอกไม่ได้ในเบราว์เซอร์นี้"; }
  });

  const sha256 = async (t) => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)))].map((x) => x.toString(16).padStart(2, "0")).join("");
  $("reset").addEventListener("click", () => {
    if (!list.length) return;
    $("tools").innerHTML = `<input id="resetCode" type="password" placeholder="รหัสเพื่อเริ่มใหม่" autocomplete="off" style="font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);max-width:170px">
      <button class="btn d" id="resetOk" type="button">ยืนยันล้าง</button> <button class="btn" id="resetNo" type="button">ยกเลิก</button>`;
    $("resetCode").focus();
  });
  document.addEventListener("click", async (e) => {
    if (e.target.id === "resetNo") $("tools").textContent = "";
    if (e.target.id === "resetOk") {
      if ((await sha256($("resetCode").value.trim())) !== RESET_HASH) { $("tools").insertAdjacentHTML("beforeend", ' <span style="color:var(--bad)">รหัสไม่ถูกต้อง</span>'); return; }
      list = []; save(); render(); $("tools").textContent = "เริ่มรายการใหม่แล้ว"; $("msg").textContent = "";
    }
  });

  render();
  $("doIn").focus();
</script>
<script src="numpad.js"></script>
<script>NumPad.bind(document);</script>
<script src="topbar.js"></script>
</body>
</html>
