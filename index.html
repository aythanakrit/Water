<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Production">
<title>Production BY ช่างกันต์</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: header + grid of tool cards; one list (TOOLS) drives the cards */
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #5d6675; --line: #dde1e7;
    --accent: #1f5fbf; --chip: #e8eefa;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171c; --card: #1d2128; --text: #e6e9ee; --muted: #9aa3b0; --line: #2e343d;
      --accent: #6fa3ff; --chip: #23314a; color-scheme: dark; }
  }
  :root[data-theme="dark"] {
    --bg: #14171c; --card: #1d2128; --text: #e6e9ee; --muted: #9aa3b0; --line: #2e343d;
    --accent: #6fa3ff; --chip: #23314a; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, "Sarabun", "Noto Sans Thai", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding-block: 28px 48px;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 1.5rem; margin: 0 0 4px; text-wrap: balance; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  .head .sub { margin: 0; }
  .avatar { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; flex: none; border: 2px solid var(--line); }
  .sub { color: var(--muted); margin: 0 0 24px; }
  h2 { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .tool { display: flex; flex-direction: column; gap: 6px; background: var(--card); border: 1px solid var(--line);
          border-radius: 10px; padding: 16px; color: inherit; text-decoration: none; min-width: 0; }
  a.tool:hover, a.tool:focus-visible { border-color: var(--accent); outline: none; }
  a.tool:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  .tool b { font-size: 1.05rem; }
  .tool p { margin: 0; color: var(--muted); font-size: .9rem; }
  .ref { align-self: flex-start; font-size: .75rem; background: var(--chip); color: var(--accent); border-radius: 999px; padding: 1px 9px; }
  .tool.soon { opacity: .6; border-style: dashed; }
  .tool.soon .ref { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .go { margin-top: auto; padding-top: 6px; color: var(--accent); font-size: .9rem; }
  footer { font-size: 1.05rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
</style>
</head>
<body>
<main>
  <div class="head">
    <div>
      <h1>Production BY ช่างกันต์</h1>
      <p class="sub">หนอนที่ตื่นสาย จะไม่ถูกนกคาบไปแดก</p>
    </div>
    <img class="avatar" src="icons/icon-192.png" alt="ช่างกันต์">
  </div>

  <h2>พร้อมใช้งาน</h2>
  <div class="grid" id="ready"></div>

  <footer>หากสงสัยวิธีใช้งาน สอบถามได้ครับ</footer>
</main>

<script>
  // Add a tool: append one entry.
  const TOOLS = [
    { title: "Mix Design คอนกรีต", ref: "ACI 211.1",
      desc: "ออกแบบสัดส่วนผสม พร้อม fly ash และน้ำยา",
      href: "mix-design.html" },
    { title: "Mix Rev. Design", ref: "ปรับสูตรหน้างาน",
      desc: "ปรับปูนหน้างาน คำนวณน้ำยาต่อเที่ยวโหลด",
      href: "dose.html" },
    { title: "คำนวณผลกดลูกปูน", ref: "kN ↔ ksc",
      desc: "แปลง kN ↔ ksc ↔ MPa",
      href: "convert.html" },
    { title: "ตรวจสอบผลกดลูกปูน Coring", ref: "ACI 318 · ASTM C42",
      desc: "ตรวจผลกด core ผ่าน/ไม่ผ่าน",
      href: "core.html" },
    { title: "ใบรายงานสนาม", ref: "FM-PQ-10",
      desc: "บันทึกรถหน้างาน สแกน D/O ออก PDF",
      href: "field.html" },
    { title: "Dashboard การส่งคอนกรีต", ref: "รายโครงการ",
      desc: "สรุปคิว รถโม่ และปัญหารายโครงการ",
      href: "dashboard.html" },
    { title: "ปริมาตรคอนกรีต", ref: "m³ + เผื่อสูญเสีย",
      desc: "คิดคิวจากขนาดงาน พร้อมเหตุผลที่เผื่อ",
      href: "volume.html" },
    { title: "Trial Mix", ref: "Slump loss 0–180 นาที",
      desc: "บันทึก slump อุณหภูมิ unit weight ออก PDF",
      href: "trial.html" },
  ];

  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const card = (t) => t.href
    ? `<a class="tool" href="${esc(t.href)}"><span class="ref">${esc(t.ref)}</span><b>${esc(t.title)}</b><p>${esc(t.desc)}</p><span class="go">เปิดโปรแกรม →</span></a>`
    : `<div class="tool soon"><span class="ref">${esc(t.ref)}</span><b>${esc(t.title)}</b><p>${esc(t.desc)}</p></div>`;
  document.getElementById("ready").innerHTML = TOOLS.filter((t) => t.href).map(card).join("");
</script>
</body>
</html>
