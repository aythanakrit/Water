<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="apple-mobile-web-app-title" content="Production">
<title>รายการค้างซ่อม</title>
<!-- DESIGN PROTOTYPE: sample data in memory only, nothing is saved -->
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #5d6675; --line: #dde1e7; --accent: #1f5fbf; --ok: #1d7a3e; --ok-bg: #e3f4e8;
    --bad: #b42318; --bad-bg: #fde4e1; --warn: #a15c00; --warn-bg: #fff1d6; --info-bg: #e5eefc; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #14171c; --card: #1d2128; --text: #e6e9ee; --muted: #9aa3b0; --line: #2e343d; --accent: #6fa3ff; --ok: #5cc98a; --ok-bg: #1b3325;
      --bad: #ff8a80; --bad-bg: #3a1d1b; --warn: #f0b44c; --warn-bg: #3a2c12; --info-bg: #1c2a44; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #14171c; --card: #1d2128; --text: #e6e9ee; --muted: #9aa3b0; --line: #2e343d; --accent: #6fa3ff; --ok: #5cc98a; --ok-bg: #1b3325;
    --bad: #ff8a80; --bad-bg: #3a1d1b; --warn: #f0b44c; --warn-bg: #3a2c12; --info-bg: #1c2a44; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Sarabun", "Noto Sans Thai", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 90px max(16px, env(safe-area-inset-left, 0px)); }
  h1 { font-size: 1.4rem; margin: 0 0 2px; } h2 { font-size: 1rem; margin: 0 0 8px; }
  .sub { color: var(--muted); margin: 0 0 12px; font-size: .9rem; }
  .back { display: inline-block; color: var(--accent); text-decoration: none; font-size: .9rem; margin-bottom: 10px; }
  .proto { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: .85rem; margin-bottom: 12px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  @media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; font: inherit; color: inherit; }
  .kpi b { display: block; font-size: 1.7rem; line-height: 1.2; font-variant-numeric: tabular-nums; } .kpi span { font-size: .8rem; color: var(--muted); }
  .kpi.bad b { color: var(--bad); } .kpi.warn b { color: var(--warn); } .kpi.ok b { color: var(--ok); } .kpi.on { outline: 2px solid var(--accent); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  select, input[type=text], input[type=number], textarea { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .filters select { flex: 1 1 140px; min-width: 0; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { font: inherit; border: 0; background: var(--card); color: var(--muted); padding: 6px 14px; cursor: pointer; } .seg button.on { background: var(--accent); color: #fff; }
  .item { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .item:first-of-type { border-top: 0; }
  .thumb { width: 56px; height: 56px; border-radius: 10px; background: var(--info-bg); display: grid; place-items: center; font-size: 1.6rem; overflow: hidden; }
  .item b { display: block; } .item .meta { color: var(--muted); font-size: .82rem; }
  .age { text-align: right; font-variant-numeric: tabular-nums; } .age b { font-size: 1.3rem; } .age small { display: block; color: var(--muted); font-size: .75rem; }
  .age.bad b { color: var(--bad); } .age.warn b { color: var(--warn); }
  .chip { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: .78rem; font-weight: 600; margin-right: 4px; }
  .s-new { background: var(--info-bg); color: var(--accent); } .s-fix { background: var(--warn-bg); color: var(--warn); } .s-part { background: var(--bad-bg); color: var(--bad); } .s-done { background: var(--ok-bg); color: var(--ok); }
  .u-stop { background: var(--bad); color: #fff; } .u-soon { background: var(--warn-bg); color: var(--warn); } .u-wait { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .empty { color: var(--muted); padding: 18px 0; text-align: center; }
  .fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); font: inherit; font-size: 1.05rem; font-weight: 600;
    border: 0; border-radius: 999px; padding: 14px 22px; background: var(--accent); color: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.25); cursor: pointer; }
  /* sheet */
  .sheet { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
  .sheet[hidden] { display: none; }
  .panel { background: var(--card); width: 100%; max-width: 640px; max-height: 92vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 16px 18px max(18px, env(safe-area-inset-bottom, 0px)); }
  @media (min-width: 700px) { .sheet { align-items: center; } .panel { border-radius: 16px; } }
  .panel h2 { font-size: 1.15rem; display: flex; justify-content: space-between; align-items: center; }
  .x { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 8px; width: 36px; height: 36px; cursor: pointer; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; }
  .full { width: 100%; } textarea { width: 100%; min-height: 70px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pick { display: flex; gap: 6px; flex-wrap: wrap; } .pick button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .pick button.on { border-color: var(--accent); background: var(--accent); color: #fff; } .pick.u button.on[data-v="stop"] { background: var(--bad); border-color: var(--bad); }
  .photos { display: flex; gap: 8px; flex-wrap: wrap; } .photos .ph { width: 76px; height: 76px; border-radius: 10px; background: var(--info-bg) center/cover; display: grid; place-items: center; font-size: 1.6rem; }
  .photos .add { border: 2px dashed var(--line); background: none; color: var(--muted); font-size: 1.4rem; cursor: pointer; }
  .btns { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .btn { font: inherit; border-radius: 10px; padding: 10px 16px; border: 1px solid var(--line); background: var(--card); color: var(--accent); cursor: pointer; flex: 1; min-height: 46px; }
  .btn.b { background: var(--accent); border-color: var(--accent); color: #fff; } .btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .tl { list-style: none; margin: 8px 0 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); }
  .tl li { position: relative; padding: 0 0 12px 10px; font-size: .9rem; } .tl li::before { content: ""; position: absolute; left: -21px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .tl small { display: block; color: var(--muted); font-size: .78rem; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .92rem; } .facts dt { color: var(--muted); } .facts dd { margin: 0; }
  .note { font-size: .8rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">← หน้าหลัก</a>
  <h1>รายการค้างซ่อม</h1>
  <p class="sub">เครื่องจักรในแพล้น และรถตัก · แจ้งซ่อม → ติดตาม → ปิดงาน</p>
  <div class="proto">🧪 ต้นแบบดีไซน์ — ข้อมูลในหน้านี้เป็นตัวอย่างสมมติ กดเล่นได้ แต่ยังไม่บันทึกจริง</div>

  <div class="kpis" id="kpis"></div>

  <section>
    <div class="filters">
      <select id="fPlant"><option value="">ทุกแพล้น</option></select>
      <select id="fType"><option value="">เครื่องจักร + รถตัก</option><option>เครื่องจักร</option><option>รถตัก</option></select>
      <div class="seg" id="fOpen"><button data-v="open" class="on">ค้างอยู่</button><button data-v="done">ปิดแล้ว</button></div>
    </div>
    <div id="list"></div>
  </section>
  <p class="note">เรียงงานหยุดผลิตก่อน แล้วตามจำนวนวันที่ค้าง · สีแดง = ค้างเกิน 7 วัน · สีส้ม = 3–7 วัน</p>
</main>

<button class="fab" id="newBtn" type="button">+ แจ้งซ่อม</button>

<!-- new report -->
<div class="sheet" id="sNew" hidden><div class="panel">
  <h2>แจ้งซ่อม <button class="x" data-close>✕</button></h2>
  <div class="two">
    <div><label>แพล้น</label><select class="full" id="nPlant"></select></div>
    <div><label>ประเภท</label><select class="full" id="nType"><option>เครื่องจักร</option><option>รถตัก</option></select></div>
  </div>
  <label>เครื่อง / รถ</label><input type="text" class="full" id="nMachine" placeholder="เช่น สกรูลำเลียงปูน, รถตัก L-01" list="machines">
  <datalist id="machines"></datalist>
  <label>อาการ</label><textarea id="nSymptom" placeholder="เช่น มีเสียงดัง ลูกปืนร้อน"></textarea>
  <label>ความเร่งด่วน</label>
  <div class="pick u" id="nUrg"><button data-v="stop">🛑 หยุดผลิต</button><button data-v="soon" class="on">ใช้ได้ แต่ต้องซ่อม</button><button data-v="wait">รอได้</button></div>
  <label>รูป (ถ่าย/แนบ)</label>
  <div class="photos"><button class="ph add" type="button">📷</button></div>
  <label>ผู้แจ้ง</label><input type="text" class="full" id="nBy" placeholder="ชื่อ">
  <div class="btns"><button class="btn" data-close>ยกเลิก</button><button class="btn b" id="nSave">บันทึกแจ้งซ่อม</button></div>
</div></div>

<!-- detail -->
<div class="sheet" id="sView" hidden><div class="panel" id="vBody"></div></div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const DAY = 864e5, now = Date.now();
  const STATUS = { new: ["แจ้งแล้ว", "s-new"], fix: ["กำลังซ่อม", "s-fix"], part: ["รออะไหล่", "s-part"], done: ["ซ่อมเสร็จ", "s-done"] };
  const URG = { stop: ["หยุดผลิต", "u-stop"], soon: ["ต้องซ่อม", "u-soon"], wait: ["รอได้", "u-wait"] };
  const PLANTS = ["P003 คลองตัน", "P014 เพชรพระราม", "P027 บางพลี", "P106 บางพลี3"];
  const ago = (d, h = 9) => now - d * DAY - h * 36e5;
  // sample (made-up) jobs for the design
  let jobs = [
    { id: 1, plant: "P027 บางพลี", type: "เครื่องจักร", machine: "สกรูลำเลียงปูน #2", symptom: "เสียงดัง ลูกปืนร้อน", urg: "soon", status: "part", by: "ตัวอย่าง ก.", at: ago(12),
      log: [[ago(12), "แจ้งซ่อม"], [ago(11), "ช่างเข้าตรวจ — ลูกปืนแตก"], [ago(10), "สั่งอะไหล่ ลูกปืน 2 ตัว"]] },
    { id: 2, plant: "P003 คลองตัน", type: "รถตัก", machine: "รถตัก L-01", symptom: "ไฮดรอลิกบุ้งกี๋รั่ว ยกไม่ขึ้น", urg: "stop", status: "fix", by: "ตัวอย่าง ข.", at: ago(1, 3),
      log: [[ago(1, 3), "แจ้งซ่อม"], [ago(0, 20), "ช่างภายนอกเข้าซ่อม"]] },
    { id: 3, plant: "P014 เพชรพระราม", type: "เครื่องจักร", machine: "ปั๊มน้ำ", symptom: "แรงดันตก", urg: "soon", status: "new", by: "ตัวอย่าง ค.", at: ago(4), log: [[ago(4), "แจ้งซ่อม"]] },
    { id: 4, plant: "P106 บางพลี3", type: "รถตัก", machine: "รถตัก L-03", symptom: "ไฟหน้าดับ 1 ดวง", urg: "wait", status: "new", by: "ตัวอย่าง ง.", at: ago(2), log: [[ago(2), "แจ้งซ่อม"]] },
    { id: 5, plant: "P027 บางพลี", type: "เครื่องจักร", machine: "เครื่องอัดลม", symptom: "รั่วที่ข้อต่อ", urg: "soon", status: "done", by: "ตัวอย่าง ก.", at: ago(9), doneAt: ago(6), cost: 1200,
      log: [[ago(9), "แจ้งซ่อม"], [ago(6), "เปลี่ยนข้อต่อ — ปิดงาน"]] },
  ];
  let view = "open", kpiFilter = "";
  PLANTS.forEach((p) => { $("fPlant").add(new Option(p, p)); $("nPlant").add(new Option(p, p)); });
  ["สกรูลำเลียงปูน", "สายพานหิน", "ปั๊มน้ำ", "เครื่องอัดลม", "โม่ผสม", "ตาชั่ง", "รถตัก L-01", "รถตัก L-02", "รถตัก L-03"].forEach((m) => $("machines").append(new Option(m)));
  const days = (j) => Math.floor(((j.doneAt || now) - j.at) / DAY);
  const thd = (t) => new Date(t).toLocaleString("th-TH", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

  function render() {
    const open = jobs.filter((j) => j.status !== "done");
    const doneMonth = jobs.filter((j) => j.status === "done" && new Date(j.doneAt).getMonth() === new Date().getMonth());
    const K = [["all", open.length, "ค้างซ่อมทั้งหมด", ""], ["stop", open.filter((j) => j.urg === "stop").length, "หยุดผลิตอยู่", "bad"],
      ["old", open.filter((j) => days(j) > 7).length, "ค้างเกิน 7 วัน", "warn"], ["done", doneMonth.length, "ปิดงานเดือนนี้", "ok"]];
    $("kpis").innerHTML = K.map(([k, n, t, c]) => `<button class="kpi ${c}${kpiFilter === k ? " on" : ""}" data-k="${k}"><b>${n}</b><span>${t}</span></button>`).join("");
    const P = $("fPlant").value, T = $("fType").value;
    let list = jobs.filter((j) => (view === "done") === (j.status === "done") && (!P || j.plant === P) && (!T || j.type === T));
    if (kpiFilter === "stop") list = list.filter((j) => j.urg === "stop");
    if (kpiFilter === "old") list = list.filter((j) => days(j) > 7);
    const rank = { stop: 0, soon: 1, wait: 2 };
    list.sort((a, b) => view === "done" ? b.doneAt - a.doneAt : rank[a.urg] - rank[b.urg] || days(b) - days(a));
    $("list").innerHTML = list.length ? list.map((j) => { const d = days(j), cls = j.status === "done" ? "" : d > 7 ? "bad" : d >= 3 ? "warn" : "";
      return `<div class="item" data-id="${j.id}"><div class="thumb">${j.type === "รถตัก" ? "🚜" : "⚙️"}</div>
        <div><b>${esc(j.machine)}</b><div class="meta">${esc(j.plant)} · ${esc(j.symptom)}</div>
        <div style="margin-top:4px"><span class="chip ${URG[j.urg][1]}">${URG[j.urg][0]}</span><span class="chip ${STATUS[j.status][1]}">${STATUS[j.status][0]}</span></div></div>
        <div class="age ${cls}"><b>${d}</b><small>${j.status === "done" ? "วันที่ใช้ซ่อม" : "วันที่ค้าง"}</small></div></div>`; }).join("")
      : `<div class="empty">${view === "done" ? "ยังไม่มีงานที่ปิด" : "ไม่มีงานค้าง 🎉"}</div>`;
  }

  function openView(id) {
    const j = jobs.find((x) => x.id === id); if (!j) return;
    const closed = j.status === "done";
    $("vBody").innerHTML = `<h2>${esc(j.machine)} <button class="x" data-close>✕</button></h2>
      <div><span class="chip ${URG[j.urg][1]}">${URG[j.urg][0]}</span><span class="chip ${STATUS[j.status][1]}">${STATUS[j.status][0]}</span>
        <b style="margin-left:6px">${closed ? `ซ่อม ${days(j)} วัน` : `ค้าง ${days(j)} วัน`}</b></div>
      <dl class="facts" style="margin-top:10px"><dt>แพล้น</dt><dd>${esc(j.plant)}</dd><dt>ประเภท</dt><dd>${esc(j.type)}</dd><dt>อาการ</dt><dd>${esc(j.symptom)}</dd>
        <dt>ผู้แจ้ง</dt><dd>${esc(j.by)} · ${thd(j.at)}</dd>${closed ? `<dt>ค่าซ่อม</dt><dd>${(j.cost || 0).toLocaleString()} บาท</dd>` : ""}</dl>
      <div class="photos" style="margin-top:10px"><div class="ph">📷</div><div class="ph">📷</div></div>
      <h2 style="margin-top:14px">ความคืบหน้า</h2>
      <ul class="tl">${j.log.map(([t, s]) => `<li>${esc(s)}<small>${thd(t)}</small></li>`).join("")}</ul>
      ${closed ? "" : `<label>อัปเดตสถานะ</label>
      <div class="pick" id="uSt">${["new", "fix", "part"].map((k) => `<button data-v="${k}" class="${j.status === k ? "on" : ""}">${STATUS[k][0]}</button>`).join("")}</div>
      <label>บันทึก (ถ้ามี)</label><input type="text" class="full" id="uNote" placeholder="เช่น สั่งอะไหล่แล้ว คาดว่าได้ศุกร์">
      <div class="btns"><button class="btn b" id="uSave">บันทึกความคืบหน้า</button></div>
      <details style="margin-top:12px"><summary style="cursor:pointer;color:var(--ok);font-weight:600">✓ ซ่อมเสร็จ — ปิดงาน</summary>
        <div class="two"><div><label>ค่าซ่อม (บาท)</label><input type="number" class="full" id="cCost" inputmode="decimal"></div>
        <div><label>ผู้ซ่อม</label><input type="text" class="full" id="cBy" placeholder="ช่างในบริษัท / ร้าน…"></div></div>
        <label>สิ่งที่ทำ</label><input type="text" class="full" id="cWhat" placeholder="เช่น เปลี่ยนลูกปืน 2 ตัว">
        <div class="btns"><button class="btn ok" id="cSave">ปิดงาน</button></div></details>`}`;
    $("sView").hidden = false;
    if (closed) return;
    let st = j.status;
    $("uSt").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; st = b.dataset.v; $("uSt").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); };
    $("uSave").onclick = () => { const note = $("uNote").value.trim();
      if (st !== j.status) j.log.push([Date.now(), "สถานะ: " + STATUS[st][0] + (note ? " — " + note : "")]); else if (note) j.log.push([Date.now(), note]);
      j.status = st; render(); openView(j.id); };
    $("cSave").onclick = () => { j.status = "done"; j.doneAt = Date.now(); j.cost = Number($("cCost").value) || 0;
      j.log.push([j.doneAt, "ปิดงาน" + ($("cWhat").value.trim() ? " — " + $("cWhat").value.trim() : "") + ($("cBy").value.trim() ? " (" + $("cBy").value.trim() + ")" : "")]);
      $("sView").hidden = true; render(); };
  }

  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-close]")) { e.target.closest(".sheet").hidden = true; return; }
    if (e.target.classList.contains("sheet")) { e.target.hidden = true; return; }
    const k = e.target.closest(".kpi");
    if (k) { const v = k.dataset.k; if (v === "done") { view = "done"; kpiFilter = ""; } else { view = "open"; kpiFilter = kpiFilter === v || v === "all" ? "" : v; }
      $("fOpen").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === view)); return render(); }
    const it = e.target.closest(".item"); if (it) return openView(Number(it.dataset.id));
  });
  $("fOpen").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; view = b.dataset.v; kpiFilter = "";
    $("fOpen").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); render(); };
  $("fPlant").onchange = $("fType").onchange = render;
  $("newBtn").onclick = () => { $("sNew").hidden = false; };
  $("nUrg").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; $("nUrg").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); };
  $("nSave").onclick = () => {
    const m = $("nMachine").value.trim(), s = $("nSymptom").value.trim();
    if (!m || !s) { (m ? $("nSymptom") : $("nMachine")).focus(); return; }
    const t = Date.now();
    jobs.push({ id: t, plant: $("nPlant").value, type: $("nType").value, machine: m, symptom: s, urg: $("nUrg").querySelector(".on").dataset.v, status: "new",
      by: $("nBy").value.trim() || "-", at: t, log: [[t, "แจ้งซ่อม"]] });
    ["nMachine", "nSymptom", "nBy"].forEach((id) => ($(id).value = "")); $("sNew").hidden = true; view = "open"; kpiFilter = ""; render();
  };
  render();
})();
</script>
</body>
</html>
