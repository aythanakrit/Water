<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="apple-mobile-web-app-title" content="Production">
<title>รายการค้างซ่อม</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #5d6675; --line: #dde1e7; --accent: #1f5fbf; --ok: #1d7a3e; --ok-bg: #e3f4e8;
    --bad: #b42318; --bad-bg: #fde4e1; --warn: #a15c00; --warn-bg: #fff1d6; --info-bg: #e5eefc; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #14171c; --card: #1d2128; --text: #e6e9ee; --muted: #9aa3b0; --line: #2e343d; --accent: #6fa3ff; --ok: #5cc98a; --ok-bg: #1b3325;
      --bad: #ff8a80; --bad-bg: #3a1d1b; --warn: #f0b44c; --warn-bg: #3a2c12; --info-bg: #1c2a44; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #14171c; --card: #1d2128; --text: #e6e9ee; --muted: #9aa3b0; --line: #2e343d; --accent: #6fa3ff; --ok: #5cc98a; --ok-bg: #1b3325;
    --bad: #ff8a80; --bad-bg: #3a1d1b; --warn: #f0b44c; --warn-bg: #3a2c12; --info-bg: #1c2a44; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Sarabun", "Noto Sans Thai", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 90px max(16px, env(safe-area-inset-left, 0px)); }
  h1 { font-size: 1.4rem; margin: 0 0 2px; } h2 { font-size: 1rem; margin: 0 0 8px; }
  .sub { color: var(--muted); margin: 0 0 12px; font-size: .9rem; }
  .back { display: inline-block; color: var(--accent); text-decoration: none; font-size: .9rem; margin-bottom: 10px; }
  .msg { min-height: 0; margin: 0 0 10px; font-weight: 600; } .msg:empty { display: none; } .msg.bad { color: var(--bad); }
  .photos .ph { position: relative; display: block; } .photos .rm { position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%; border: 0;
    background: var(--bad); color: #fff; font-size: 14px; line-height: 24px; padding: 0; cursor: pointer; }
  .row2 { display: flex; gap: 8px; margin-top: 8px; } .row2 input { flex: 1; min-width: 0; }
  .doc { display: inline-block; font-size: .78rem; font-weight: 700; color: var(--accent); background: var(--info-bg); border-radius: 6px; padding: 0 6px; margin-right: 6px; vertical-align: 2px; }
  .openT { display: none; } body.bdopen .openT { display: inline; } body.bdopen div.openT { display: block; } body.bdopen .lockT { display: none; }
  details.adm { margin-top: 12px; border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px; } details.adm summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
  input[type=date], input[type=time], input[type=password] { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  #nMsg { color: var(--bad); font-size: .9rem; margin-top: 8px; min-height: 1.2em; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  @media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; font: inherit; color: inherit; }
  .kpi b { display: block; font-size: 1.7rem; line-height: 1.2; font-variant-numeric: tabular-nums; } .kpi span { font-size: .8rem; color: var(--muted); }
  .kpi.bad b { color: var(--bad); } .kpi.warn b { color: var(--warn); } .kpi.ok b { color: var(--ok); } .kpi.on { outline: 2px solid var(--accent); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  select, input[type=text], input[type=number], textarea { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .filters select { flex: 1 1 140px; min-width: 0; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { font: inherit; border: 0; background: var(--card); color: var(--muted); padding: 6px 14px; cursor: pointer; } .seg button.on { background: var(--accent); color: #fff; }
  .item { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .item:first-of-type { border-top: 0; }
  .thumb { width: 56px; height: 56px; border-radius: 10px; background: var(--info-bg); display: grid; place-items: center; font-size: 1.6rem; overflow: hidden; }
  .item b { display: block; } .item .meta { color: var(--muted); font-size: .82rem; }
  .age { text-align: right; font-variant-numeric: tabular-nums; } .age b { font-size: 1.3rem; } .age small { display: block; color: var(--muted); font-size: .75rem; }
  .age.bad b { color: var(--bad); } .age.warn b { color: var(--warn); }
  .chip { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: .78rem; font-weight: 600; margin-right: 4px; }
  .s-new { background: var(--info-bg); color: var(--accent); } .s-fix { background: var(--warn-bg); color: var(--warn); } .s-part { background: var(--bad-bg); color: var(--bad); } .s-done { background: var(--ok-bg); color: var(--ok); }
  .u-stop { background: var(--bad); color: #fff; } .u-soon { background: var(--warn-bg); color: var(--warn); } .u-wait { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .empty { color: var(--muted); padding: 18px 0; text-align: center; }
  .fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); font: inherit; font-size: 1.05rem; font-weight: 600;
    border: 0; border-radius: 999px; padding: 14px 22px; background: var(--accent); color: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.25); cursor: pointer; }
  /* sheet */
  .sheet { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
  .sheet[hidden] { display: none; }
  .panel { background: var(--card); width: 100%; max-width: 640px; max-height: 92vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 16px 18px max(18px, env(safe-area-inset-bottom, 0px)); }
  @media (min-width: 700px) { .sheet { align-items: center; } .panel { border-radius: 16px; } }
  .panel h2 { font-size: 1.15rem; display: flex; justify-content: space-between; align-items: center; }
  .x { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 8px; width: 36px; height: 36px; cursor: pointer; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; }
  .full { width: 100%; } textarea { width: 100%; min-height: 70px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pick { display: flex; gap: 6px; flex-wrap: wrap; } .pick button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .pick button.on { border-color: var(--accent); background: var(--accent); color: #fff; } .pick.u button.on[data-v="stop"] { background: var(--bad); border-color: var(--bad); }
  .photos { display: flex; gap: 8px; flex-wrap: wrap; } .photos .ph { width: 76px; height: 76px; border-radius: 10px; background: var(--info-bg) center/cover; display: grid; place-items: center; font-size: 1.6rem; }
  .photos .add { border: 2px dashed var(--line); background: none; color: var(--muted); font-size: 1.4rem; cursor: pointer; }
  .btns { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .btn { font: inherit; border-radius: 10px; padding: 10px 16px; border: 1px solid var(--line); background: var(--card); color: var(--accent); cursor: pointer; flex: 1; min-height: 46px; }
  .btn.b { background: var(--accent); border-color: var(--accent); color: #fff; } .btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .tl { list-style: none; margin: 8px 0 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); }
  .tl li { position: relative; padding: 0 0 12px 10px; font-size: .9rem; } .tl li::before { content: ""; position: absolute; left: -21px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .tl small { display: block; color: var(--muted); font-size: .78rem; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .92rem; } .facts dt { color: var(--muted); } .facts dd { margin: 0; }
  .note { font-size: .8rem; color: var(--muted); }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .top .btn { flex: 0 0 auto; min-height: 40px; padding: 8px 14px; }
  /* report (A4) */
  #rep { position: fixed; inset: 0; z-index: 60; background: #6b7280; overflow: auto; padding: 16px 8px 40px; }
  #rep[hidden] { display: none; }
  #rep .bar { max-width: 210mm; margin: 0 auto 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #rep .bar select { flex: 1 1 160px; min-width: 0; background: #fff; color: #1d2330; }
  #rep .bar .btn { flex: 0 0 auto; background: #fff; }
  #rep .bar .btn.b { background: var(--accent); color: #fff; }
  .a4 { -webkit-print-color-adjust: exact; print-color-adjust: exact; background: #fff; color: #111; width: 100%; max-width: 210mm; min-height: 297mm; margin: 0 auto; padding: 14mm 12mm; font-size: 12px; line-height: 1.45;
    box-shadow: 0 4px 20px rgba(0,0,0,.3); }
  .a4 .hd { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #111; padding-bottom: 6px; margin-bottom: 10px; gap: 8px; }
  .a4 .hd b { font-size: 18px; display: block; } .a4 .hd .r { text-align: right; font-size: 11px; color: #444; }
  .a4 .sum { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 12px; }
  .a4 .sum div { border: 1px solid #bbb; border-radius: 6px; padding: 5px 8px; } .a4 .sum b { display: block; font-size: 18px; }
  .a4 .sum .red b { color: #b42318; }
  .a4 h3 { font-size: 13px; margin: 14px 0 4px; padding: 3px 8px; background: #eef1f5; border-left: 4px solid #1f5fbf; }
  .a4 table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .a4 th, .a4 td { border: 1px solid #bbb; padding: 3px 5px; vertical-align: top; text-align: left; }
  .a4 th { background: #f3f4f6; font-size: 11px; } .a4 td.n { text-align: right; white-space: nowrap; } .a4 td.c { text-align: center; white-space: nowrap; }
  .a4 tr.stop td { background: #fde4e1; } .a4 .old { color: #b42318; font-weight: 700; }
  .a4 .tot td { font-weight: 700; background: #f3f4f6; }
  .a4 .sign { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 28px; text-align: center; font-size: 11px; }
  .a4 .sign div { border-top: 1px dotted #555; padding-top: 4px; margin-top: 30px; }
  .a4 .ft { margin-top: 16px; font-size: 10px; color: #666; }
  @media (max-width: 560px) { .a4 { padding: 8mm 5mm; font-size: 10.5px; } .a4 .sum { grid-template-columns: repeat(3, 1fr); } }
  @media print {
    @page { size: A4; margin: 10mm; }
    body > *:not(#rep) { display: none !important; }
    #rep { position: static; background: none; padding: 0; overflow: visible; } #rep .bar { display: none; }
    .a4 { box-shadow: none; padding: 0; min-height: 0; max-width: none; }
  }
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">← หน้าหลัก</a>
  <div class="top"><h1>รายการค้างซ่อม</h1><button class="btn" id="repBtn" type="button">📄 รายงาน</button></div>
  <p class="sub">เครื่องจักรในแพล้น และรถตัก · แจ้งซ่อม → ติดตาม → ปิดงาน · เห็นตรงกันทุกเครื่อง</p>
  <div class="msg" id="msg" role="status"></div>

  <div class="kpis" id="kpis"></div>

  <section>
    <div class="filters">
      <select id="fPlant"><option value="">ทุกแพล้น</option></select>
      <select id="fType"><option value="">เครื่องจักร + รถตัก</option><option>เครื่องจักร</option><option>รถตัก</option></select>
      <div class="seg" id="fOpen"><button data-v="open" class="on">ค้างอยู่</button><button data-v="done">ปิดแล้ว</button></div>
    </div>
    <div id="list"></div>
  </section>
  <p class="note">เรียงงานหยุดผลิตก่อน แล้วตามจำนวนวันที่ค้าง · สีแดง = ค้างเกิน 7 วัน · สีส้ม = 3–7 วัน</p>
</main>

<button class="fab" id="newBtn" type="button">+ แจ้งซ่อม</button>

<!-- new report -->
<div class="sheet" id="sNew" hidden><div class="panel">
  <h2>แจ้งซ่อม <button class="x" data-close>✕</button></h2>
  <label>เลขที่เอกสาร</label><input type="text" class="full" id="nDoc" placeholder="ใส่เอง (เว้นว่างได้)" autocomplete="off">
  <div class="two">
    <div><label>แพล้น</label><select class="full" id="nPlant"></select></div>
    <div><label>ประเภท</label><select class="full" id="nType"><option>เครื่องจักร</option><option>รถตัก</option></select></div>
  </div>
  <div id="mBox" hidden><label>รถตักคันไหน</label><input type="text" class="full" id="nMachine" placeholder="เช่น รถตัก L-01" list="machines"></div>
  <datalist id="machines"></datalist>
  <label>อาการ</label><textarea id="nSymptom" placeholder="เช่น สกรูลำเลียงปูนเสียงดัง ลูกปืนร้อน"></textarea>
  <label>ความเร่งด่วน</label>
  <div class="pick u" id="nUrg"><button data-v="stop">🛑 หยุดผลิต</button><button data-v="soon" class="on">ใช้ได้ แต่ต้องซ่อม</button><button data-v="wait">รอได้</button></div>
  <label>รูป (ถ่าย/แนบ)</label>
  <div class="photos" id="nPhotos"></div>
  <input type="file" id="nFile" accept="image/*" multiple hidden>
  <details class="adm" id="nAdmBox"><summary><span class="lockT">🔒 ลงย้อนหลัง (ผู้ดูแล)</span><span class="openT">📅 เลือกวันที่แจ้งซ่อมเอง</span></summary>
    <div class="two"><div><label>วันที่แจ้งซ่อม</label><input type="date" class="full" id="nDate"></div><div><label>เวลา</label><input type="time" class="full" id="nTime" value="08:00"></div></div>
    <div class="lockT"><label>รหัสผู้ดูแล</label><input type="password" class="full" id="nAdm" autocomplete="off"></div>
    <p class="note" style="margin:6px 0 0">เว้นวันที่ว่าง = แจ้งวันนี้ตามปกติ</p></details>
  <div id="nMsg" role="alert"></div>
  <div class="btns"><button class="btn" data-close>ยกเลิก</button><button class="btn b" id="nSave">บันทึกแจ้งซ่อม</button></div>
</div></div>

<!-- report -->
<div id="rep" hidden>
  <div class="bar">
    <select id="rPlant"><option value="">ทุกแพล้น</option></select>
    <select id="rMonth"></select>
    <button class="btn b" id="rPrint" type="button">🖨 พิมพ์ / บันทึก PDF</button>
    <button class="btn" id="rClose" type="button">ปิด</button>
  </div>
  <div class="a4" id="rPage"></div>
</div>

<!-- detail -->
<div class="sheet" id="sView" hidden><div class="panel" id="vBody"></div></div>
<input type="file" id="vFile" accept="image/*" multiple hidden>

<script src="config.js"></script>
<script src="fieldreport.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const DAY = 864e5;
  const CLOUD = window.FIELD_SYNC && window.FIELD_SYNC.url === "/api" && window.FIELD_SYNC.key ? window.FIELD_SYNC : null;
  const DEL_HASH = "c6f9017f4820b334c5b7a4b271f1c0429e3147839f3c56422045cd4fd407476a"; // same code as deleting a field report
  const sha256 = async (t) => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)))].map((x) => x.toString(16).padStart(2, "0")).join("");
  const STATUS = { new: ["แจ้งแล้ว", "s-new"], fix: ["กำลังซ่อม", "s-fix"], part: ["รออะไหล่", "s-part"], done: ["ซ่อมเสร็จ", "s-done"] };
  const URG = { stop: ["หยุดผลิต", "u-stop"], soon: ["ต้องซ่อม", "u-soon"], wait: ["รอได้", "u-wait"] };
  const RANK = { stop: 0, soon: 1, wait: 2 };
  const PLANTS = [...((window.FieldReport && FieldReport.PLANTS) || [])].sort((a, b) => a[0].localeCompare(b[0])).map(([c, n]) => `P${c} ${n}`);
  const isLoader = (j) => j.type === "รถตัก";
  const title = (j) => isLoader(j) ? j.machine : j.symptom;
  const docTag = (j) => j.docNo ? `<span class="doc">${esc(j.docNo)}</span>` : "";
  const ADM = "repair-admin"; // the administrator code, kept until the tab is closed
  const admGet = () => { try { return sessionStorage.getItem(ADM) || ""; } catch (e) { return ""; } };
  const admSet = (v) => { try { v ? sessionStorage.setItem(ADM, v) : sessionStorage.removeItem(ADM); } catch (e) {} };
  const atOf = (d, t) => { if (!d) return null; const [y, m, dd] = d.split("-").map(Number), [h, mi] = (t || "08:00").split(":").map(Number); return new Date(y, m - 1, dd, h || 0, mi || 0).getTime(); };
  const errText = (e, what) => e.message === "not_admin" ? "รหัสผู้ดูแลไม่ถูกต้อง" : e.message === "bad_date" ? "วันที่ไม่ถูกต้อง (ห้ามเป็นวันในอนาคต" + (what === "close" ? " หรือก่อนวันแจ้งซ่อม" : "") + ")" : navigator.onLine ? "บันทึกไม่ได้ — ลองใหม่" : "ออฟไลน์ — ต้องต่ออินเทอร์เน็ต";
  const days = (j) => Math.max(0, Math.floor(((j.doneAt || Date.now()) - j.at) / DAY));
  const thd = (t) => new Date(t).toLocaleString("th-TH", { day: "numeric", month: "short", year: "2-digit", hour: "2-digit", minute: "2-digit" });
  const photoURL = (id) => `/api/repairphoto?key=${encodeURIComponent(CLOUD.key)}&id=${encodeURIComponent(id)}`;
  const store = { get: (k) => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

  let jobs = [], view = "open", kpiFilter = "", openId = null, busy = false, vDirty = false, backdateOpen = false;
  const say = (t, bad) => { $("msg").textContent = t || ""; $("msg").className = bad ? "msg bad" : "msg"; };

  async function api(action, body = {}) {
    const r = await fetch(CLOUD.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ ...body, action, key: CLOUD.key }) });
    const x = await r.json();
    if (!x.ok) throw new Error(x.error || "failed");
    return x;
  }
  async function load(quiet) {
    if (!CLOUD) return say("ยังไม่ได้ต่อระบบออนไลน์ — บันทึกไม่ได้", true);
    try {
      const x = await api("repairList");
      jobs = x.jobs; backdateOpen = !!x.backdateOpen; document.body.classList.toggle("bdopen", backdateOpen); say(""); render();
      // the open job is redrawn with what other devices saved, unless something is being typed in it
      if (openId && !$("sView").hidden && !vDirty && !document.activeElement.closest("#vBody input, #vBody textarea, #vBody details[open]")) openView(openId);
      if (!$("rep").hidden) renderReport();
    } catch (e) { if (!quiet || !jobs.length) say(navigator.onLine ? "โหลดข้อมูลไม่ได้ — ลองใหม่อีกครั้ง" : "ออฟไลน์ — ต้องต่ออินเทอร์เน็ต", true); }
  }

  // ---------- plants ----------
  function plantOptions(sel, list, first) { sel.innerHTML = (first ? `<option value="">${first}</option>` : "") + list.map((p) => `<option value="${esc(p)}">${esc(p)}</option>`).join(""); }
  plantOptions($("nPlant"), PLANTS);
  if (PLANTS.includes(store.get("repair-plant"))) $("nPlant").value = store.get("repair-plant");
  function usedPlants() { return [...new Set(jobs.map((j) => j.plant))].sort(); }
  function syncFilter(sel, first) { const v = sel.value; plantOptions(sel, usedPlants(), first); if ([...sel.options].some((o) => o.value === v)) sel.value = v; }

  // ---------- list ----------
  function render() {
    syncFilter($("fPlant"), "ทุกแพล้น");
    $("machines").innerHTML = [...new Set(jobs.filter(isLoader).map((j) => j.machine))].map((m) => `<option value="${esc(m)}">`).join("");
    const open = jobs.filter((j) => j.status !== "done"), m = new Date();
    const doneMonth = jobs.filter((j) => j.status === "done" && new Date(j.doneAt).getMonth() === m.getMonth() && new Date(j.doneAt).getFullYear() === m.getFullYear());
    const K = [["all", open.length, "ค้างซ่อมทั้งหมด", ""], ["stop", open.filter((j) => j.urg === "stop").length, "หยุดผลิตอยู่", "bad"],
      ["old", open.filter((j) => days(j) > 7).length, "ค้างเกิน 7 วัน", "warn"], ["done", doneMonth.length, "ปิดงานเดือนนี้", "ok"]];
    $("kpis").innerHTML = K.map(([k, n, t, c]) => `<button class="kpi ${c}${kpiFilter === k ? " on" : ""}" data-k="${k}"><b>${n}</b><span>${t}</span></button>`).join("");
    const P = $("fPlant").value, T = $("fType").value;
    let list = jobs.filter((j) => (view === "done") === (j.status === "done") && (!P || j.plant === P) && (!T || j.type === T));
    if (kpiFilter === "stop") list = list.filter((j) => j.urg === "stop");
    if (kpiFilter === "old") list = list.filter((j) => days(j) > 7);
    list.sort((a, b) => view === "done" ? b.doneAt - a.doneAt : RANK[a.urg] - RANK[b.urg] || days(b) - days(a));
    $("list").innerHTML = list.length ? list.map((j) => { const d = days(j), cls = j.status === "done" ? "" : d > 7 ? "bad" : d >= 3 ? "warn" : "";
      return `<div class="item" data-id="${esc(j.id)}"><div class="thumb"${j.photos.length ? ` style="background:center/cover url('${photoURL(j.photos[0])}')"` : ""}>${j.photos.length ? "" : isLoader(j) ? "🚜" : "⚙️"}</div>
        <div><b>${docTag(j)}${esc(title(j))}</b><div class="meta">${esc(j.plant)} · ${isLoader(j) ? esc(j.symptom) : "เครื่องจักร"}</div>
        <div style="margin-top:4px"><span class="chip ${URG[j.urg][1]}">${URG[j.urg][0]}</span><span class="chip ${STATUS[j.status][1]}">${STATUS[j.status][0]}</span></div></div>
        <div class="age ${cls}"><b>${d}</b><small>${j.status === "done" ? "วันที่ใช้ซ่อม" : "วันที่ค้าง"}</small></div></div>`; }).join("")
      : `<div class="empty">${!CLOUD ? "" : view === "done" ? "ยังไม่มีงานที่ปิด" : "ไม่มีงานค้าง 🎉"}</div>`;
  }

  // ---------- photos: shrunk to 1600 px JPEG on this device ----------
  const shrink = (file) => new Promise((ok, no) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); c.toBlob((b) => (b ? ok(b) : no(new Error("x"))), "image/jpeg", 0.8); };
    img.onerror = () => { URL.revokeObjectURL(u); no(new Error("x")); }; img.src = u; });
  async function upload(jobId, blobs) {
    let bad = 0;
    for (const b of blobs) {
      try { const x = await (await fetch(`/api/repairphoto?key=${encodeURIComponent(CLOUD.key)}&job=${encodeURIComponent(jobId)}`, { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: b })).json(); if (!x.ok) bad++; }
      catch (e) { bad++; }
    }
    return bad;
  }
  let pics = [];
  function renderPics() { $("nPhotos").innerHTML = pics.map((b, i) => `<span class="ph" style="background-image:url('${URL.createObjectURL(b)}')"><button type="button" class="rm" data-rmpic="${i}">×</button></span>`).join("")
    + `<button class="ph add" type="button" id="nAdd" title="ถ่าย/แนบรูป">📷</button>`; }
  $("nPhotos").addEventListener("click", (e) => {
    const r = e.target.closest("[data-rmpic]"); if (r) { pics.splice(+r.dataset.rmpic, 1); return renderPics(); }
    if (e.target.closest("#nAdd")) $("nFile").click();
  });
  $("nFile").addEventListener("change", async (e) => { for (const f of [...e.target.files]) { try { pics.push(await shrink(f)); } catch (x) {} } e.target.value = ""; renderPics(); });

  // ---------- new job ----------
  $("newBtn").onclick = () => { if (!CLOUD) return say("ยังไม่ได้ต่อระบบออนไลน์ — บันทึกไม่ได้", true); $("nMsg").textContent = ""; $("nAdm").value = admGet(); $("nDate").max = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10); renderPics(); $("sNew").hidden = false; };
  $("nType").onchange = () => { $("mBox").hidden = $("nType").value !== "รถตัก"; };
  $("nUrg").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; $("nUrg").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); };
  $("nSave").onclick = async () => {
    if (busy) return;
    const loader = $("nType").value === "รถตัก", m = loader ? $("nMachine").value.trim() : "", s = $("nSymptom").value.trim();
    if (loader && !m) { $("nMsg").textContent = "ใส่ว่ารถตักคันไหน"; return $("nMachine").focus(); }
    if (!s) { $("nMsg").textContent = "ใส่อาการ"; return $("nSymptom").focus(); }
    busy = true; $("nSave").disabled = true; $("nMsg").textContent = "กำลังบันทึก…";
    try {
      const at = atOf($("nDate").value, $("nTime").value), adm = $("nAdm").value.trim();
      if (at && !adm && !backdateOpen) { $("nMsg").textContent = "ลงย้อนหลังต้องใส่รหัสผู้ดูแล"; $("nAdm").focus(); return; }
      const x = await api("repairAdd", { docNo: $("nDoc").value.trim(), plant: $("nPlant").value, type: $("nType").value, machine: m, symptom: s, urg: $("nUrg").querySelector(".on").dataset.v,
        ...(at ? { at, adminKey: adm } : {}) });
      if (at) admSet(adm);
      store.set("repair-plant", $("nPlant").value);
      if (pics.length) { $("nMsg").textContent = `กำลังส่งรูป ${pics.length} รูป…`; const bad = await upload(x.id, pics); if (bad) alert(`บันทึกแล้ว แต่ส่งรูปไม่ได้ ${bad} รูป — เปิดงานแล้วเพิ่มรูปอีกครั้ง`); }
      pics = []; ["nMachine", "nSymptom", "nDoc", "nDate"].forEach((id) => ($(id).value = "")); $("sNew").hidden = true; view = "open"; kpiFilter = "";
      $("fOpen").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === "open"));
      await load();
    } catch (e) { $("nMsg").textContent = errText(e); }
    finally { busy = false; $("nSave").disabled = false; }
  };

  // ---------- one job ----------
  function openView(id) {
    const j = jobs.find((x) => x.id === id); if (!j) { $("sView").hidden = true; openId = null; return; }
    openId = id; vDirty = false;
    const closed = j.status === "done";
    $("vBody").innerHTML = `<h2><span>${docTag(j)}${esc(title(j))}</span> <button class="x" data-close>✕</button></h2>
      <div><span class="chip ${URG[j.urg][1]}">${URG[j.urg][0]}</span><span class="chip ${STATUS[j.status][1]}">${STATUS[j.status][0]}</span>
        <b style="margin-left:6px">${closed ? `ซ่อม ${days(j)} วัน` : `ค้าง ${days(j)} วัน`}</b></div>
      <div class="row2"><input type="text" id="vDoc" value="${esc(j.docNo)}" placeholder="เลขที่เอกสาร" autocomplete="off"><button class="btn" id="vDocGo" style="flex:0 0 auto">บันทึกเลขที่</button></div>
      <dl class="facts" style="margin-top:10px"><dt>แพล้น</dt><dd>${esc(j.plant)}</dd><dt>ประเภท</dt><dd>${esc(j.type)}${isLoader(j) ? " · " + esc(j.machine) : ""}</dd><dt>อาการ</dt><dd>${esc(j.symptom)}</dd>
        <dt>แจ้งเมื่อ</dt><dd>${thd(j.at)}</dd>${closed ? `<dt>ซ่อมเสร็จ</dt><dd>${thd(j.doneAt)}</dd>` : ""}</dl>
      <div class="photos" style="margin-top:10px">${j.photos.map((p) => `<a class="ph" href="${photoURL(p)}" target="_blank" rel="noopener" style="background-image:url('${photoURL(p)}')"></a>`).join("")}
        <button class="ph add" type="button" id="vAdd" title="เพิ่มรูป">📷</button></div>
      <div class="note" id="vPhMsg"></div>
      <h2 style="margin-top:14px">ความคืบหน้า</h2>
      <ul class="tl">${j.log.map(([t, s]) => `<li>${esc(s)}<small>${thd(t)}</small></li>`).join("")}</ul>
      ${closed ? "" : `<label>อัปเดตสถานะ</label>
      <div class="pick" id="uSt">${["new", "fix", "part"].map((k) => `<button data-v="${k}" class="${j.status === k ? "on" : ""}">${STATUS[k][0]}</button>`).join("")}</div>
      <label>ความเร่งด่วน</label>
      <div class="pick u" id="uUrg">${["stop", "soon", "wait"].map((k) => `<button data-v="${k}" class="${j.urg === k ? "on" : ""}">${k === "stop" ? "🛑 หยุดผลิต" : k === "soon" ? "ใช้ได้ แต่ต้องซ่อม" : "รอได้"}</button>`).join("")}</div>
      <label>บันทึก (ถ้ามี)</label><input type="text" class="full" id="uNote" placeholder="เช่น สั่งอะไหล่แล้ว คาดว่าได้ศุกร์">
      <div class="btns"><button class="btn b" id="uSave">บันทึกความคืบหน้า</button></div>
      <details style="margin-top:12px"><summary style="cursor:pointer;color:var(--ok);font-weight:600">✓ ซ่อมเสร็จ — ปิดงาน</summary>
        <label>ผู้ซ่อม</label><input type="text" class="full" id="cBy" placeholder="ช่างในบริษัท / ร้าน…">
        <label>สิ่งที่ทำ</label><input type="text" class="full" id="cWhat" placeholder="เช่น เปลี่ยนลูกปืน 2 ตัว">
        <details class="adm"><summary><span class="lockT">🔒 ปิดงานย้อนหลัง (ผู้ดูแล)</span><span class="openT">📅 เลือกวันที่ซ่อมเสร็จเอง</span></summary>
          <div class="two"><div><label>วันที่ซ่อมเสร็จ</label><input type="date" class="full" id="cDate"></div><div><label>เวลา</label><input type="time" class="full" id="cTime" value="17:00"></div></div>
          <div class="lockT"><label>รหัสผู้ดูแล</label><input type="password" class="full" id="cAdm" value="${esc(admGet())}" autocomplete="off"></div></details>
        <div class="btns"><button class="btn ok" id="cSave">ปิดงาน</button></div></details>`}
      <div class="note" id="vMsg" style="margin-top:8px"></div>
      <details style="margin-top:14px"><summary class="note" style="cursor:pointer">ลบงานนี้ (แจ้งผิด / ซ้ำ)</summary>
        <div class="row2"><input type="password" id="dCode" placeholder="รหัสลบ" autocomplete="off"><button class="btn" id="dGo" style="color:var(--bad);flex:0 0 auto">ลบ</button></div></details>`;
    $("sView").hidden = false;
    $("vAdd").onclick = () => $("vFile").click();
    $("dGo").onclick = async () => {
      if ((await sha256($("dCode").value.trim())) !== DEL_HASH) { $("vMsg").textContent = "รหัสไม่ถูกต้อง"; return; }
      try { await api("repairDelete", { id: j.id }); $("sView").hidden = true; openId = null; await load(); } catch (e) { $("vMsg").textContent = "ลบไม่ได้ — ลองใหม่"; }
    };
    $("vDocGo").onclick = async () => {
      try { await api("repairUpdate", { id: j.id, docNo: $("vDoc").value.trim() }); $("vDoc").blur(); vDirty = false; await load(); openView(j.id); $("vMsg").textContent = "บันทึกเลขที่เอกสารแล้ว"; }
      catch (e) { $("vMsg").textContent = errText(e); }
    };
    if (closed) return;
    let st = j.status, ug = j.urg;
    const pick = (box, set) => (e) => { const b = e.target.closest("button"); if (!b) return; set(b.dataset.v); box.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); };
    $("uSt").onclick = pick($("uSt"), (v) => (st = v)); $("uUrg").onclick = pick($("uUrg"), (v) => (ug = v));
    $("uSave").onclick = async () => {
      if (busy) return; busy = true; $("vMsg").textContent = "กำลังบันทึก…";
      try { await api("repairUpdate", { id: j.id, status: st, urg: ug, note: $("uNote").value.trim() }); $("uNote").blur(); vDirty = false; await load(); openView(j.id); }
      catch (e) { $("vMsg").textContent = "บันทึกไม่ได้ — ลองใหม่"; } finally { busy = false; }
    };
    $("cSave").onclick = async () => {
      if (busy) return; busy = true; $("vMsg").textContent = "กำลังปิดงาน…";
      const at = atOf($("cDate").value, $("cTime").value), adm = $("cAdm").value.trim();
      if (at && !adm && !backdateOpen) { busy = false; $("vMsg").textContent = "ปิดงานย้อนหลังต้องใส่รหัสผู้ดูแล"; return; }
      try { await api("repairClose", { id: j.id, what: $("cWhat").value.trim(), by: $("cBy").value.trim(), ...(at ? { at, adminKey: adm } : {}) }); if (at) admSet(adm); $("sView").hidden = true; openId = null; await load(); }
      catch (e) { $("vMsg").textContent = errText(e, "close"); } finally { busy = false; }
    };
  }
  $("vBody").addEventListener("input", () => { vDirty = true; });
  $("vFile").addEventListener("change", async (e) => {
    const files = [...e.target.files]; e.target.value = ""; if (!files.length || !openId) return;
    const id = openId; $("vPhMsg").textContent = `กำลังส่งรูป ${files.length} รูป…`;
    const blobs = []; for (const f of files) { try { blobs.push(await shrink(f)); } catch (x) {} }
    const bad = await upload(id, blobs);
    await load(); if (bad && $("vPhMsg")) $("vPhMsg").textContent = `ส่งรูปไม่ได้ ${bad} รูป — ลองใหม่`;
  });

  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-close]")) { const s = e.target.closest(".sheet"); s.hidden = true; if (s.id === "sView") openId = null; return; }
    if (e.target.classList.contains("sheet")) { e.target.hidden = true; if (e.target.id === "sView") openId = null; return; }
    const k = e.target.closest(".kpi");
    if (k) { const v = k.dataset.k; if (v === "done") { view = "done"; kpiFilter = ""; } else { view = "open"; kpiFilter = kpiFilter === v || v === "all" ? "" : v; }
      $("fOpen").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === view)); return render(); }
    const it = e.target.closest(".item"); if (it) return openView(it.dataset.id);
  });
  $("fOpen").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; view = b.dataset.v; kpiFilter = "";
    $("fOpen").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); render(); };
  $("fPlant").onchange = $("fType").onchange = render;

  // ---------- report (A4) ----------
  const MONTHS = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
  const dmy = (t) => { const d = new Date(t); return `${d.getDate()}/${d.getMonth() + 1}/${(d.getFullYear() + 543) % 100}`; };
  for (let i = 0; i < 12; i++) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); $("rMonth").add(new Option(`ปิดงานเดือน ${MONTHS[d.getMonth()]} ${d.getFullYear() + 543}`, d.getFullYear() + "-" + d.getMonth())); }
  function renderReport() {
    syncFilter($("rPlant"), "ทุกแพล้น");
    const P = $("rPlant").value, [y, m] = $("rMonth").value.split("-").map(Number);
    const mine = jobs.filter((j) => !P || j.plant === P);
    const open = mine.filter((j) => j.status !== "done").sort((a, b) => a.plant.localeCompare(b.plant) || RANK[a.urg] - RANK[b.urg] || days(b) - days(a));
    const done = mine.filter((j) => j.status === "done" && new Date(j.doneAt).getFullYear() === y && new Date(j.doneAt).getMonth() === m).sort((a, b) => a.doneAt - b.doneAt);
    const avg = done.length ? (done.reduce((s, j) => s + days(j), 0) / done.length).toFixed(1) : "-";
    const last = (j) => j.log.length > 1 ? j.log[j.log.length - 1][1] : "";
    $("rPage").innerHTML = `<div class="hd"><div><b>รายงานงานค้างซ่อม เครื่องจักร / รถตัก</b>${esc(P || "ทุกแพล้น")}</div>
        <div class="r">บริษัท เอ็มคอนกรีต จำกัด · ฝ่ายผลิต<br>ข้อมูล ณ ${new Date().toLocaleString("th-TH", { dateStyle: "long", timeStyle: "short" })}</div></div>
      <div class="sum"><div><b>${open.length}</b>ค้างซ่อม</div><div class="red"><b>${open.filter((j) => j.urg === "stop").length}</b>หยุดผลิต</div>
        <div class="red"><b>${open.filter((j) => days(j) > 7).length}</b>ค้างเกิน 7 วัน</div><div><b>${done.length}</b>ปิดงานในเดือน</div><div><b>${avg}</b>วันซ่อมเฉลี่ย</div></div>
      <h3>1. งานค้างซ่อม (${open.length} รายการ)</h3>
      ${open.length ? `<table><thead><tr><th>เลขที่เอกสาร</th><th>แพล้น</th><th>เครื่อง / รถ</th><th>อาการ</th><th>ความเร่งด่วน</th><th>สถานะ</th><th>แจ้งเมื่อ</th><th>ค้าง (วัน)</th><th>ความคืบหน้าล่าสุด</th></tr></thead><tbody>
        ${open.map((j, i) => `<tr class="${j.urg === "stop" ? "stop" : ""}"><td class="c">${esc(j.docNo) || "-"}</td><td>${esc(j.plant)}</td><td>${isLoader(j) ? esc(j.machine) : "เครื่องจักร"}</td>
          <td>${esc(j.symptom)}</td><td class="c">${URG[j.urg][0]}</td><td class="c">${STATUS[j.status][0]}</td><td class="c">${dmy(j.at)}</td>
          <td class="n ${days(j) > 7 ? "old" : ""}">${days(j)}</td><td>${esc(last(j))}</td></tr>`).join("")}</tbody></table>` : `<p>ไม่มีงานค้าง</p>`}
      <h3>2. งานที่ซ่อมเสร็จในเดือน${esc($("rMonth").selectedOptions[0].text.replace("ปิดงานเดือน", ""))} (${done.length} รายการ · เฉลี่ย ${avg} วัน/งาน)</h3>
      ${done.length ? `<table><thead><tr><th>เลขที่เอกสาร</th><th>แพล้น</th><th>เครื่อง / รถ</th><th>อาการ</th><th>สิ่งที่ทำ</th><th>แจ้ง</th><th>เสร็จ</th><th>ใช้เวลา (วัน)</th></tr></thead><tbody>
        ${done.map((j, i) => `<tr><td class="c">${esc(j.docNo) || "-"}</td><td>${esc(j.plant)}</td><td>${isLoader(j) ? esc(j.machine) : "เครื่องจักร"}</td><td>${esc(j.symptom)}</td><td>${esc(last(j).replace(/^ปิดงาน( — )?/, ""))}</td>
          <td class="c">${dmy(j.at)}</td><td class="c">${dmy(j.doneAt)}</td><td class="n">${days(j)}</td></tr>`).join("")}</tbody></table>` : `<p>ไม่มีงานที่ปิดในเดือนนี้</p>`}
      <div class="sign"><div>ผู้จัดทำ</div><div>ผู้จัดการเขตผลิต</div></div>
      <div class="ft">แถวสีแดง = เครื่องหยุดผลิต · ตัวเลขสีแดง = ค้างเกิน 7 วัน · จำนวนวันนับจากวันที่แจ้งซ่อม</div>`;
  }
  $("repBtn").onclick = () => { renderReport(); $("rep").hidden = false; };
  $("rClose").onclick = () => { $("rep").hidden = true; };
  $("rPlant").onchange = $("rMonth").onchange = renderReport;
  $("rPrint").onclick = () => window.print();

  // every device sees the same list: refresh every 15 s while the page is showing
  render(); load();
  setInterval(() => { if (document.visibilityState === "visible" && !busy) load(true); }, 15000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(true); });
})();
</script>
</body>
</html>
