<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Production">
<title>Dashboard การส่งคอนกรีต</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #5d6675; --line: #dde1e7; --grid: #eceff3;
    --accent: #1f5fbf; --warn-bg: #fff6e0; --warn: #8a5a00; --bad: #b42318; --ok: #1d7a3e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #14171c; --card: #1d2128; --text: #e6e9ee; --muted: #9aa3b0; --line: #2e343d; --grid: #262b33;
      --accent: #6fa3ff; --warn-bg: #3a2f14; --warn: #f2c66d; --bad: #ff8a80; --ok: #5cc98a; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #14171c; --card: #1d2128; --text: #e6e9ee; --muted: #9aa3b0; --line: #2e343d; --grid: #262b33;
    --accent: #6fa3ff; --warn-bg: #3a2f14; --warn: #f2c66d; --bad: #ff8a80; --ok: #5cc98a; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Sarabun", "Noto Sans Thai", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding-block: 20px 56px;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  h2 { font-size: 1.02rem; margin: 0 0 10px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  a.back { display: inline-block; color: var(--accent); text-decoration: none; font-size: .9rem; margin-bottom: 10px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; min-width: 0; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  label { display: flex; flex-direction: column; font-size: .82rem; color: var(--muted); gap: 2px; }
  input, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  button { font: inherit; border-radius: 6px; padding: 6px 12px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--accent); }
  button.b { background: var(--accent); border-color: var(--accent); color: var(--card); }
  button[aria-pressed="true"] { background: var(--accent); color: var(--card); border-color: var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .status { font-size: .85rem; color: var(--muted); margin-top: 8px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .9rem; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child, td.l, th.l { text-align: left; }
  th { font-size: .78rem; color: var(--muted); font-weight: 600; }
  td.wrap { white-space: normal; min-width: 16em; text-align: left; }
  .pill { display: inline-block; border-radius: 999px; padding: 0 8px; font-size: .78rem; font-weight: 600; }
  .pill.bad { background: var(--bad); color: var(--card); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.ok { color: var(--ok); }
  .tip { position: fixed; pointer-events: none; background: var(--text); color: var(--card); font-size: .82rem; padding: 4px 8px; border-radius: 6px; }
  .note { font-size: .82rem; color: var(--muted); }
  .empty { color: var(--muted); padding: 20px 0; text-align: center; }
  .proj-head { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; margin-bottom: 12px; }
  .proj-head b { font-size: 1.1rem; }
  .proj-head span { color: var(--muted); font-size: .9rem; }
  .win { display: inline-block; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; margin: 2px 4px 2px 0; font-size: .82rem; white-space: nowrap; }
  td.wins { white-space: normal; text-align: left; min-width: 18em; }
  .issue { color: var(--bad); }
  @media (max-width: 600px) { td.wins, td.wrap { min-width: 9em; } .win { white-space: normal; } th, td { padding: 6px 5px; } }
  h3 { font-size: .92rem; margin: 16px 0 6px; }
  input.bad-time { border-color: var(--bad); outline: 1px solid var(--bad); }
  input.dth { width: 9.5em; font-variant-numeric: tabular-nums; }
  .kpis { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 4px; }
  .kpi { border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; min-width: 150px; }
  .kpi b { display: block; font-size: 1.2rem; color: var(--accent); font-variant-numeric: tabular-nums; }
  .kpi span { font-size: .78rem; color: var(--muted); }
  table.hours th, table.hours td { text-align: center; }
  table.hours th.l, table.hours td.l { text-align: left; }
  table.hours td.sum, table.hours th.sum { border-right: 1px solid var(--line); }
  tr.tot td { font-weight: 700; border-top: 1.5px solid var(--muted); }
  /* long jobs (24 h, many plants): the name column stays in view while the hours scroll */
  table.hours th:first-child, table.hours td:first-child { position: sticky; left: 0; background: var(--card); z-index: 1; }
  table.hours th.st, table.hours td.st { width: 3.2em; min-width: 3.2em; }
  table.hours th.st2, table.hours td.st2 { position: sticky; left: 3.2em; background: var(--card); z-index: 1; }
  table.hours td:first-child.l { min-width: 7.5em; max-width: 12em; white-space: normal; }
  /* PDF: drawn off screen in light colours, tables at full width (no scrolling, no sticky columns) */
  #pdfRoot { position: absolute; left: -20000px; top: 0; padding: 0 16px; font-size: 14px;
    --bg: #fff; --card: #fff; --text: #1d2330; --muted: #5d6675; --line: #cfd5dd; --grid: #eceff3;
    --accent: #1f5fbf; --warn-bg: #fff6e0; --warn: #8a5a00; --bad: #b42318; --ok: #1d7a3e; background: #fff; color: var(--text); }
  #pdfRoot .scroll { overflow: visible; }
  #pdfRoot table.hours th, #pdfRoot table.hours td { position: static !important; }
  #pdfRoot .unit { padding: 2px 0 6px; background: #fff; }
  #pdfRoot .ptitle { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--text); padding: 8px 0 6px; margin-bottom: 8px; }
  #pdfRoot .ptitle b { font-size: 1.25rem; } #pdfRoot .ptitle span { color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">← หน้าหลัก</a>
  <h1>Dashboard การส่งคอนกรีต</h1>
  <p class="sub">ดูทีละโครงการจากใบรายงานสนาม · เฉพาะรถที่มีเลข D/O · เกณฑ์เวลาเดียวกับใบรายงานสนาม</p>

  <section>
    <div class="filters">
      <div class="row" role="group" aria-label="ช่วงเวลา" style="display:flex;gap:6px;flex-wrap:wrap">
        <button type="button" data-range="0">วันนี้</button>
        <button type="button" data-range="7" aria-pressed="true">7 วัน</button>
        <button type="button" data-range="30">30 วัน</button>
        <button type="button" data-range="month">เดือนนี้</button>
      </div>
      <label>ตั้งแต่<input class="dth" id="from"></label>
      <label>ถึง<input class="dth" id="to"></label>
      <button class="b" type="button" id="load">แสดงผล</button>
      <button type="button" id="csv">ดาวน์โหลด CSV</button>
      <button type="button" id="pdf">ดาวน์โหลด PDF</button>
    </div>
    <div class="status" id="status"></div>
    <p id="onlyNote" hidden style="margin:6px 0 0;font-size:.9rem"><b id="onlyText"></b> · <button type="button" id="onlyAll" style="padding:2px 8px">ดูทั้งโครงการ</button></p>
    <label id="live" hidden style="flex-direction:row;align-items:center;gap:6px;margin-top:6px;font-size:.85rem"><input type="checkbox" id="liveOn"> อัปเดตอัตโนมัติทุก 30 วินาที</label>
  </section>

  <section id="projBox">
    <div class="filters" style="margin-bottom:10px">
      <label style="flex:1;min-width:220px">โครงการ<select id="project"></select></label>
    </div>
    <div id="proj"></div>
  </section>

  <div class="tip" id="tip" hidden></div>
</main>

<script src="fieldreport.js"></script>
<script src="fieldsync.js"></script>
<script src="dashboard.js"></script>
<script src="numpad.js"></script>
<script src="config.js"></script>
<script>
  NumPad.bind(document);
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmt = (x, d = 1) => x == null || !isFinite(x) ? "–" : Number(x).toLocaleString("th-TH", { minimumFractionDigits: d, maximumFractionDigits: d });
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const thDate = (s) => { const [y, m, d] = s.split("-").map(Number); return `${d}/${m}/${String(y + 543).slice(2)}`; };
  const L = FieldReport.LIMITS;
  const SYNC = window.FIELD_SYNC && window.FIELD_SYNC.url ? window.FIELD_SYNC : null;

  let jobs = [], rows = [];

  function setRange(r) {
    const t = new Date(), f = new Date();
    if (r === "month") f.setDate(1); else f.setDate(t.getDate() - Math.max(Number(r) - 1, 0));
    $("from").value = iso(f); $("to").value = iso(t);
    document.querySelectorAll("[data-range]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.range === String(r))));
  }
  document.querySelectorAll("[data-range]").forEach((b) => b.addEventListener("click", () => { setRange(b.dataset.range); load(); }));
  ["from", "to"].forEach((id) => $(id).addEventListener("change", () => document.querySelectorAll("[data-range]").forEach((b) => b.setAttribute("aria-pressed", "false"))));
  $("load").addEventListener("click", load);
  $("project").addEventListener("change", render);

  async function load() {
    const from = $("from").value, to = $("to").value;
    const quiet = !!jobs.length && $("liveOn") && $("liveOn").checked; // live refresh: keep the page as it is while loading
    if (!quiet) $("status").textContent = "กำลังโหลด…";
    try {
      if (SYNC) {
        const res = await fetch(SYNC.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "report", from, to, key: SYNC.key }) });
        const out = await res.json();
        if (!out.ok) throw new Error(out.error === "unknown_action" ? "Apps Script ยังเป็นเวอร์ชันเก่า — ต้องอัปเดตโค้ดและ Deploy เวอร์ชันใหม่" : out.error);
        jobs = out.jobs;
        $("status").textContent = SYNC.url === "/api" ? `ข้อมูลจากระบบกลาง · ${thDate(from)} – ${thDate(to)}` : `ข้อมูลจาก Google Sheets · ${thDate(from)} – ${thDate(to)} · งานที่จบเกิน 90 วันอยู่ในไฟล์เก็บถาวร ไม่แสดงที่นี่`;
      } else {
        let db = { jobs: [] };
        try { db = JSON.parse(localStorage.getItem("field-reports-v1")) || db; } catch {}
        jobs = db.jobs.filter((j) => !j.stub);
        $("status").textContent = `ข้อมูลจากใบรายงานสนามในเครื่องนี้ · ${thDate(from)} – ${thDate(to)}`;
      }
    } catch (e) {
      jobs = [];
      $("status").textContent = "โหลดข้อมูลไม่ได้: " + (e.message || "ตรวจอินเทอร์เน็ต");
    }
    // opened from one field report: that report only
    if (onlyJob) {
      const one = jobs.find((j) => j.id === onlyJob);
      jobs = one ? [one] : [];
      const h = one ? one.header : {};
      $("onlyNote").hidden = false;
      $("onlyText").textContent = one ? `เฉพาะใบรายงานนี้: ${[h.project, [h.structure, h.structureNo].filter(Boolean).join(" ")].filter(Boolean).join(" · ")}`
        : "ยังไม่พบใบรายงานนี้ในระบบกลาง — รอเครื่องหน้างานส่งข้อมูลขึ้นก่อน";
    }
    const projects = Dashboard.groupBy(Dashboard.trips(jobs, { from, to }), "project").map((g) => g.key);
    const curP = $("project").value || wantProject;
    $("project").innerHTML = projects.length ? projects.map((p) => `<option${p === curP ? " selected" : ""}>${esc(p)}</option>`).join("") : `<option value="">ไม่มีโครงการในช่วงนี้</option>`;

    render();
    if ($("liveOn") && $("liveOn").checked) $("status").textContent += ` · อัปเดตล่าสุด ${new Date().toTimeString().slice(0, 5)}`;
  }

  function render() {
    rows = Dashboard.trips(jobs, { from: $("from").value, to: $("to").value }).filter((r) => r.project === $("project").value);
    renderProject();
  }

  function renderProject() {
    const name = $("project").value, el = $("proj");
    if (!name) { el.innerHTML = `<div class="empty">ไม่มีโครงการในช่วงวันที่นี้</div>`; return; }
    const v = Dashboard.projectView(jobs, name, { from: $("from").value, to: $("to").value });
    const dm = (d) => (d ? thDate(d).slice(0, -3) + " " : "");
    const n0 = (x) => (x ? fmt(x) : "");
    const min = (x) => (x == null ? "–" : `${Math.round(x)} นาที`);
    const head = v.columns.map((c) => `<th>${c.date ? esc(dm(c.date)) + "<br>" : ""}${esc(c.label)}</th>`).join("");
    // summary per plant, then the plant × hour table (totals first, then the hours)
    const perH = (x) => (x == null ? "–" : fmt(x));
    const sumT = v.plantHours.map((p) => `<tr><td class="l">${esc(p.plant)}</td><td>${fmt(p.volume)}</td><td><b>${perH(p.perHour)}</b></td>
      <td>${p.first ? `${p.first} – ${p.last}` : "–"}</td><td>${min(p.avgTravel)}</td></tr>`).join("") +
      `<tr class="tot"><td class="l">รวม</td><td>${fmt(v.volume)}</td><td>${perH(v.perHour)}</td><td></td><td>${min(v.avgTravel)}</td></tr>`;
    let cum = 0;
    const hourT = v.plantHours.map((p) => { cum += p.volume; return `<tr><td class="l">${esc(p.plant)}</td><td class="sum">${fmt(p.volume)}</td><td class="sum">${fmt(cum)}</td>
      ${v.columns.map((c) => `<td>${n0(p.byHour[c.key])}</td>`).join("")}</tr>`; }).join("") +
      `<tr class="tot"><td class="l">รวมทุกแพล้น</td><td class="sum">${fmt(v.volume)}</td><td class="sum"></td>${v.columns.map((c) => `<td>${n0(v.totalByHour[c.key])}</td>`).join("")}</tr>`;
    const trucksT = v.truckHours.map((t, i) => `<tr><td class="st">${i + 1}</td><td class="l st2">${esc(t.truck)}</td><td><b>${t.trips}</b></td><td>${fmt(t.volume)}</td>
      ${v.columns.map((c) => `<td>${(t.byHour[c.key] || []).length || ""}</td>`).join("")}</tr>`).join("");
    const issuesT = v.issues.map((i) => `<tr class="issue"><td class="l">${esc(thDate(i.date))}</td><td class="l">${esc(i.truck)}</td><td class="l">${esc(i.do)}</td><td class="l">${esc(i.plant)}</td><td class="wrap">${esc(i.remark)}</td></tr>`).join("");
    const noHours = `<p class="empty">ยังไม่มีเวลารถถึง</p>`;
    el.innerHTML = `
      <div class="proj-head"><b>${esc(v.project)}</b><span>${fmt(v.volume)} คิว · ${v.trips} เที่ยว · รถโม่ ${v.trucks.length} คัน · ${v.jobs} งาน</span></div>
      <div class="kpis">
        <div class="kpi"><b>${v.perHour == null ? "–" : fmt(v.perHour)}</b><span>เฉลี่ยรับ คิว/ชม. (รวม · ตามเวลาถึง)</span></div>
        <div class="kpi"><b>${min(v.avgTravel)}</b><span>เฉลี่ยเวลาเดินทาง</span></div>
      </div>
      <h3>ยอดผลิต รายแพล้น</h3>
      <div class="scroll"><table><thead><tr><th class="l">หน่วยผลิต</th><th>คิว</th><th>คิว/ชม.</th><th>ช่วงเวลารถถึง</th><th>เดินทางเฉลี่ย</th></tr></thead><tbody>${sumT}</tbody></table></div>
      <h3>ยอดรับ รายชั่วโมง (ตามเวลารถถึงหน้างาน)</h3>
      ${v.columns.length ? `<div class="scroll"><table class="hours"><thead><tr><th class="l">หน่วยผลิต</th><th class="sum">รวม</th><th class="sum">ผลรวมสะสม</th>${head}</tr></thead><tbody>${hourT}</tbody></table></div>` : noHours}
      <h3>รถโม่ ${v.trucks.length} คัน · เที่ยวตามเวลารถถึง</h3>
      ${v.columns.length ? `<div class="scroll"><table class="hours"><thead><tr><th class="st">ลำดับ</th><th class="l st2">เบอร์รถ</th><th>เที่ยว</th><th>คิว</th>${head}</tr></thead><tbody>${trucksT}</tbody></table></div>` : noHours}
      <h3>เที่ยวที่มีหมายเหตุ / ปัญหา (${v.issues.length})</h3>
      <div class="scroll"><table><thead><tr><th class="l">วันที่</th><th class="l">รถ</th><th class="l">D/O</th><th class="l">หน่วยผลิต</th><th class="l">หมายเหตุ</th></tr></thead>
        <tbody>${issuesT || `<tr><td class="empty" colspan="5">ไม่มีหมายเหตุหรือปัญหา</td></tr>`}</tbody></table></div>`;
  }

  // CSV of the trips shown (artifact viewer uses its download prompt)
  let downloads = null;
  if (window.claude && claude.use) claude.use("downloads").then((d) => { downloads = d; }).catch(() => {});
  $("csv").addEventListener("click", async () => {
    if (!rows.length) { $("status").textContent = "ไม่มีข้อมูลให้ดาวน์โหลด"; return; }
    const name = `ส่งคอนกรีต_${$("project").value}_${$("from").value}_${$("to").value}.csv`.replace(/[\\/:*?"<>|]+/g, "-");
    const blob = new Blob([Dashboard.toCSV(rows)], { type: "text/csv" });
    if (downloads) { try { await downloads.save({ filename: name, data: blob }); } catch {} return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  });

  // ---------- PDF (A4 landscape): each heading + its table stays together on a page where it fits ----------
  const loadScript = (src) => new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = src; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
  async function pdfLibs() {
    if (!window.html2canvas) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
    if (!window.jspdf) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  }
  $("pdf").addEventListener("click", async () => {
    const name = $("project").value;
    if (!name || !rows.length) { $("status").textContent = "ไม่มีข้อมูลให้ดาวน์โหลด — เลือกช่วงวันที่และโครงการก่อน"; return; }
    const btn = $("pdf"), old = $("status").textContent;
    btn.disabled = true; $("status").textContent = "กำลังสร้าง PDF…";
    let root = null;
    try {
      await pdfLibs();
      // units: [title + project head + KPIs], then each h3 with the table under it
      root = document.createElement("div"); root.id = "pdfRoot";
      const now = new Date(), p2 = (n) => String(n).padStart(2, "0");
      const stamp = `${now.getDate()}/${now.getMonth() + 1}/${now.getFullYear() + 543} ${p2(now.getHours())}:${p2(now.getMinutes())}`;
      const src = document.createElement("div"); src.innerHTML = $("proj").innerHTML;
      const kids = [...src.children], units = [];
      let first = `<div class="ptitle"><b>Dashboard การส่งคอนกรีต</b><span>ช่วง ${esc(thDate($("from").value))} – ${esc(thDate($("to").value))} · พิมพ์ ${stamp}</span></div>`;
      let i = 0;
      while (i < kids.length && kids[i].tagName !== "H3") first += kids[i++].outerHTML;
      units.push(first);
      while (i < kids.length) { let u = kids[i++].outerHTML; while (i < kids.length && kids[i].tagName !== "H3") u += kids[i++].outerHTML; units.push(u); }
      root.innerHTML = units.map((u) => `<div class="unit">${u}</div>`).join("");
      document.body.appendChild(root);
      // as wide as the widest table (long jobs have many hour columns), at least a landscape page
      const wide = Math.max(1060, ...[...root.querySelectorAll("table")].map((t) => t.scrollWidth + 32));
      root.style.width = wide + "px";
      await document.fonts.ready;

      const pdf = new jspdf.jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
      const M = 10, W = 297 - 2 * M, H = 210 - 2 * M - 6; // 6 mm kept for the page number
      const mmPerPx = W / wide;
      let y = M, page = 1;
      for (const el of root.querySelectorAll(".unit")) {
        const c = await html2canvas(el, { scale: 2, backgroundColor: "#ffffff", windowWidth: wide });
        let hmm = c.height / 2 * mmPerPx;
        if (y > M && y + hmm > M + H) { pdf.addPage("a4", "landscape"); page++; y = M; }
        if (hmm <= H) { pdf.addImage(c.toDataURL("image/jpeg", 0.92), "JPEG", M, y, W, hmm); y += hmm + 2; continue; }
        // taller than a page (many trucks): cut into page-high slices
        const slicePx = Math.floor(H / mmPerPx * 2);
        for (let top = 0; top < c.height; top += slicePx) {
          const part = document.createElement("canvas"); part.width = c.width; part.height = Math.min(slicePx, c.height - top);
          part.getContext("2d").drawImage(c, 0, top, c.width, part.height, 0, 0, c.width, part.height);
          if (top > 0) { pdf.addPage("a4", "landscape"); page++; y = M; }
          const ph = part.height / 2 * mmPerPx;
          pdf.addImage(part.toDataURL("image/jpeg", 0.92), "JPEG", M, y, W, ph); y += ph + 2;
        }
      }
      for (let n = 1; n <= page; n++) { pdf.setPage(n); pdf.setFontSize(8); pdf.setTextColor(120); pdf.text(`${n} / ${page}`, 297 - M, 210 - 5, { align: "right" }); }
      const file = `Dashboard_${name}_${$("from").value}_${$("to").value}.pdf`.replace(/[\\/:*?"<>|]+/g, "-");
      const blob = pdf.output("blob");
      if (downloads) { try { await downloads.save({ filename: file, data: blob }); } catch {} }
      else { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file; document.body.appendChild(a); a.click(); a.remove(); }
      $("status").textContent = old + ` · ดาวน์โหลด PDF แล้ว (${page} หน้า)`;
    } catch (e) {
      $("status").textContent = "สร้าง PDF ไม่ได้ — ตรวจอินเทอร์เน็ตแล้วลองใหม่";
    } finally { if (root) root.remove(); btn.disabled = false; }
  });

  // Opened from a field report (dashboard.html?project=…&date=…): that project and day, refreshed every 30 s
  const qs = new URLSearchParams(location.search);
  let wantProject = qs.get("project") || "";
  let onlyJob = qs.get("job") || "";
  $("onlyAll").addEventListener("click", () => { onlyJob = ""; $("onlyNote").hidden = true; load(); });
  const qDate = /^\d{4}-\d{2}-\d{2}$/.test(qs.get("date") || "") ? qs.get("date") : "";
  if (qDate) {
    $("from").value = qDate; $("to").value = qDate;
    document.querySelectorAll("[data-range]").forEach((b) => b.setAttribute("aria-pressed", "false"));
  } else setRange(7);
  if (wantProject || qDate || onlyJob) {
    $("live").hidden = false; $("liveOn").checked = true;
    setInterval(() => { if ($("liveOn").checked && !document.hidden) load(); }, 30000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden && $("liveOn").checked) load(); });
  }
  $("project").addEventListener("change", () => { wantProject = ""; });
  load();
</script>
<script src="topbar.js"></script>
</body>
</html>
